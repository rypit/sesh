# Test fixture for isolation_stack (specs/007 research.md R7): the four
# services as an install from before feature 007 ran them, over the
# current Compose files. They log in to Postgres as the superuser and
# share one Redis, on database indexes 0, 1 and 2. Since specs/008 there's
# no `default`, so the shared Redis joins each client's Redis network to
# be reachable by name. The test passes LEGACY_REDIS_PASSWORD (random, per
# run). Never used by `sesh up`.
services:
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    environment:
      REDIS_PASSWORD: ${LEGACY_REDIS_PASSWORD:?}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [openwebui-redis, infisical-redis, paperless-redis]

  litellm:
    environment:
      DATABASE_URL: postgresql://sesh:${POSTGRES_PASSWORD}@postgres:5432/litellm

  open-webui:
    environment:
      DATABASE_URL: postgresql://sesh:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      REDIS_URL: redis://:${LEGACY_REDIS_PASSWORD:?}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  infisical:
    environment:
      DB_CONNECTION_URI: postgresql://sesh:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://:${LEGACY_REDIS_PASSWORD:?}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  paperless:
    environment:
      PAPERLESS_DBUSER: sesh
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_REDIS: redis://:${LEGACY_REDIS_PASSWORD:?}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
