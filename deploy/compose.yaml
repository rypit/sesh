# sesh foundation stack (specs/001-foundation/contracts/stack.md).
#
# Run through `sesh up`, which passes:
#   --env-file $SESH_DATA_DIR/secrets.env   values used for interpolation only
#   SESH_DATA_DIR, SESH_WEBUI_PORT, SESH_ROUTER_PORT, SESH_INFERENCE_API_KEY
# Each container receives only the variables listed for it.
# Only open-webui, litellm and the gateway publish ports, all on loopback.
# Executors (one per agent) come from the generated overlay `compose/generated.yaml`.
# Images are pinned by tag and multi-arch index digest; upgrade deliberately.

name: sesh

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_USER: sesh
      POSTGRES_DB: sesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run sesh init}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${SESH_DATA_DIR:?}/compose/postgres-init.sql:/docker-entrypoint-initdb.d/10-sesh.sql:ro
    # `feeds-db`: Miniflux's own route to its database (specs/006 R2).
    networks: [default, feeds-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesh -d sesh"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run sesh init}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run sesh init}
      DATABASE_URL: postgresql://sesh:${POSTGRES_PASSWORD}@postgres:5432/litellm
      SESH_INFERENCE_API_KEY: ${SESH_INFERENCE_API_KEY:-none}
      LITELLM_TELEMETRY: "False"
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ${SESH_DATA_DIR:?}/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${SESH_ROUTER_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.5@sha256:e0dc5a8bf5c71cadf339d1e7b9408b357da75fb2854f82cad57a1609fadf2a22
    environment:
      # Environment always wins over values stored in Open WebUI's database.
      ENABLE_PERSISTENT_CONFIG: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run sesh init}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?run sesh init}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?run sesh init}
      ENABLE_SIGNUP: "False"
      ENABLE_MEMORIES: "False"
      ENABLE_ADMIN_CHAT_ACCESS: "False"
      # Only the alias router is a model source; it lists only aliases.
      ENABLE_OLLAMA_API: "False"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${WEBUI_ROUTER_KEY:-pending}
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      TASK_MODEL_EXTERNAL: agent-main
      DATABASE_URL: postgresql://sesh:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEBSOCKET_MANAGER: redis
      # Local-first: no telemetry, no model downloads.
      OFFLINE_MODE: "True"
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:${SESH_WEBUI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: ${SESH_GATEWAY_IMAGE:-sesh-gateway:dev}
    environment:
      SESH_GATEWAY_CONFIG: /etc/sesh/gateway.toml
      SESH_AGENTS_FILE: /etc/sesh/agents.toml
      SESH_AUDIT_DATABASE_URL: postgresql://sesh_gateway:${GATEWAY_DB_PASSWORD:?run sesh init}@postgres:5432/gateway
      SESH_GATEWAY_TEST_CONNECTORS: ${SESH_GATEWAY_TEST_CONNECTORS:-0}
      # Approvals and credentials (specs/004, ADR 0007).
      SESH_GATEWAY_ADMIN_TOKEN: ${SESH_GATEWAY_ADMIN_TOKEN:?run sesh init}
      SESH_NTFY_URL: http://ntfy:80
      SESH_NTFY_USER: sesh-gateway
      SESH_NTFY_PASSWORD: ${NTFY_GATEWAY_PASSWORD:?run sesh init}
      SESH_INFISICAL_URL: http://infisical:8080
      # Set by `sesh up` once it has bootstrapped Infisical.
      SESH_INFISICAL_CLIENT_ID: ${INFISICAL_GATEWAY_CLIENT_ID:-}
      SESH_INFISICAL_CLIENT_SECRET: ${INFISICAL_GATEWAY_CLIENT_SECRET:-}
      SESH_INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      # Documents (specs/005 research.md R6): the gateway is Paperless's
      # admin and enforces owners itself.
      SESH_PAPERLESS_USER: sesh-gateway
      SESH_PAPERLESS_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?run sesh init}
      # Feeds (specs/006, ADR 0009): the gateway is Miniflux's admin and
      # enforces owners itself.
      SESH_MINIFLUX_USER: sesh-gateway
      SESH_MINIFLUX_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?run sesh init}
    volumes:
      - ${SESH_DATA_DIR:?}/gateway:/etc/sesh:ro
    ports:
      - "127.0.0.1:${SESH_GATEWAY_PORT:-7000}:7000"
      # Approval pages and credential forms; reach them from a phone with
      # `tailscale serve` (specs/004 quickstart.md).
      - "127.0.0.1:${SESH_APPROVALS_PORT:-7002}:7002"
    networks: [default, search, docs, feeds]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7000'"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    restart: unless-stopped

  # The secret store (specs/004 research.md R5). Only the gateway's machine
  # identity can read credentials; `sesh up` bootstraps it over the
  # loopback port.
  infisical:
    image: infisical/infisical:v0.167.14@sha256:ef645c5c17c61f928a75a18c1192cb0b24a5140fb7de6bfa24e717714c8fa8dd
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?run sesh init}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?run sesh init}
      INSTANCE_SETUP_TOKEN: ${INFISICAL_SETUP_TOKEN:?run sesh init}
      DB_CONNECTION_URI: postgresql://sesh:${POSTGRES_PASSWORD:?run sesh init}@postgres:5432/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD:?run sesh init}@redis:6379/1
      SITE_URL: http://127.0.0.1:${SESH_INFISICAL_PORT:-8222}
      HOST: 0.0.0.0
      PORT: "8080"
      TELEMETRY_ENABLED: "false"
      DISABLE_UPDATE_CHECK: "true"
    ports:
      - "127.0.0.1:${SESH_INFISICAL_PORT:-8222}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The approval channel (specs/004 research.md R3): the gateway may only
  # publish to the person's topic, the person may only read it.
  ntfy:
    image: binwiederhier/ntfy:v2.38.2@sha256:ca35419d29a834824db2440fa9320897fbe40b026c5fc2360c76ed3501b5e716
    command: ["serve", "--config", "/etc/ntfy/server.yml"]
    volumes:
      - ${SESH_DATA_DIR:?}/compose/ntfy-server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    ports:
      - "127.0.0.1:${SESH_NTFY_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Documents (specs/005, ADR 0008). Reachable only from the gateway (the
  # `docs` network is internal); it reaches Postgres and Redis on `default`.
  paperless:
    image: paperlessngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
    environment:
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD:?run sesh init}@redis:6379/2
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: sesh
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?run sesh init}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?run sesh init}
      PAPERLESS_ADMIN_USER: sesh-gateway
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?run sesh init}
      PAPERLESS_ALLOWED_HOSTS: paperless,localhost,127.0.0.1
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ENABLE_UPDATE_CHECK: "false"
      PAPERLESS_TASK_WORKERS: "1"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    networks: [default, docs]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/ | grep -qE '^(200|301|302|401|403)$$'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Feeds (specs/006, ADR 0009). Reachable only from the gateway (the
  # `feeds` network is internal); `feeds-egress` lets it reach publishers,
  # and the internal `feeds-db` reaches Postgres. Never on `default`.
  miniflux:
    image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
    environment:
      # Its own login, owning only its database (specs/006 research.md R2).
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD:?run sesh init}@postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: sesh-gateway
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?run sesh init}
      LISTEN_ADDR: 0.0.0.0:8080
      POLLING_FREQUENCY: "60"
      METRICS_COLLECTOR: "0"
    networks: [feeds, feeds-egress, feeds-db]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Web search. Reachable only from the gateway (the `search` network is
  # internal); its own `searxng-egress` network lets it reach search engines.
  searxng:
    image: searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run sesh init}
    volumes:
      - ${SESH_DATA_DIR:?}/compose/searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks: [search, searxng-egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  open-webui-data:
  ntfy-data:
  paperless-data:
  paperless-media:

networks:
  default: {}
  search:
    internal: true
  docs:
    internal: true
  searxng-egress: {}
  feeds:
    internal: true
  feeds-egress: {}
  feeds-db:
    internal: true
