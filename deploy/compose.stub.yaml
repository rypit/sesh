# Development and CI only: adds the stub model server. `sesh up --stub`
# points agent-main at it. Build the image first:
#   docker build -f deploy/stub.Dockerfile -t sesh-stub-llm:dev .
services:
  stub-llm:
    image: sesh-stub-llm:dev
    environment:
      STUB_TOOLS: ${STUB_TOOLS:-on}
      # Scripted eval conversations (specs/003-model-evals/contracts/stub-script.md).
      STUB_SCRIPT: ${STUB_SCRIPT:-}
      # The hash of the credential the test connector should present (specs/004).
      STUB_TESTCRED_SHA256: ${STUB_TESTCRED_SHA256:-}
    # `stub` for LiteLLM (the model) and the gateway (fake Google, search,
    # weather, maps); `feeds-egress` for Miniflux (the fake publisher), so
    # stub mode needs no internet (specs/006, specs/008).
    networks: [stub, feeds-egress]
    restart: unless-stopped
  litellm:
    networks: [litellm-db, models, litellm-edge, stub]
  # The fake publisher is on a private address: let Miniflux fetch it, in
  # stub mode only, if this Miniflux release refuses private networks.
  miniflux:
    environment:
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
      # Fetch errors are logged only at debug level.
      LOG_LEVEL: debug
  # The test-only approval-gated connector, for negative tests.
  gateway:
    environment:
      SESH_GATEWAY_TEST_CONNECTORS: "1"
    networks: [gateway-db, secrets, notify, search, docs, feeds, gateway-edge, stub]

# Development and CI only (specs/008 research.md R6).
networks:
  stub:
    internal: true
