# Development and CI only: adds the stub model server. `sesh up --stub`
# points agent-main at it. Build the image first:
#   docker build -f deploy/stub.Dockerfile -t sesh-stub-llm:dev .
services:
  stub-llm:
    image: sesh-stub-llm:dev
    environment:
      STUB_TOOLS: ${STUB_TOOLS:-on}
      # Scripted eval conversations (specs/003-model-evals/contracts/stub-script.md).
      STUB_SCRIPT: ${STUB_SCRIPT:-}
      # The hash of the credential the test connector should present (specs/004).
      STUB_TESTCRED_SHA256: ${STUB_TESTCRED_SHA256:-}
    restart: unless-stopped
  # The test-only approval-gated connector, for negative tests.
  gateway:
    environment:
      SESH_GATEWAY_TEST_CONNECTORS: "1"
