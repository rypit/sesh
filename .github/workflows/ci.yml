name: ci

# A push to any branch runs the quick `check` (fmt, clippy, unit tests,
# cargo-deny, diagram and Compose checks), as does a pull request from a
# fork. The images and stack tests run only for pull requests, pushes to
# main, and on demand (workflow_dispatch), so intermediate pushes to a
# branch without a PR stay cheap. A newer run
# for the same branch or PR cancels the one it supersedes.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only branches (specs, plans, ADRs, Markdown) skip the images and
  # stack jobs; `check` still runs (diagram check, instance-data guard).
  # The whole branch is compared with main, not just this push, so a docs
  # push can't skip testing code from a run it cancelled. main always runs
  # everything.
  changes:
    # Stack tests: pull requests, main and manual runs only.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          files=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$files"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '^(specs/|docs/|\.specify/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change: skipping the images and stack jobs"
          fi

  check:
    # On a same-repo PR, the push run's `check` already covers the head
    # commit. A fork's pushes run no workflow here, so its PR runs `check`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: make check
        run: make check

  # The three dev images, built once (with Docker's layer cache) and handed
  # to every stack job.
  images:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the stub model server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/stub.Dockerfile
          tags: sesh-stub-llm:dev
          outputs: type=docker,dest=/tmp/sesh-stub-llm.tar
          cache-from: type=gha,scope=stub
          cache-to: type=gha,scope=stub,mode=max
      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gateway.Dockerfile
          tags: sesh-gateway:dev
          outputs: type=docker,dest=/tmp/sesh-gateway.tar
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build the executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor.Dockerfile
          tags: sesh-executor:dev
          outputs: type=docker,dest=/tmp/sesh-executor.tar
          cache-from: type=gha,scope=executor
          cache-to: type=gha,scope=executor,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: sesh-images
          path: /tmp/sesh-*.tar
          retention-days: 1

  # One job per stack test, in parallel: the run takes about as long as the
  # slowest test (isolation_stack, ~8 minutes) plus setup. Each test starts
  # and removes its own stack. The repository is public, so the extra jobs
  # cost no Actions minutes. A new stack test gets its own entry here; the
  # `every_stack_test_has_a_ci_job` test fails until it does.
  stack:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tests:
          - isolation_stack
          - network_stack
          - eval_stack
          - agent_stack
          - feeds_stack
          - foundation_stack
          - gateway_stack
          - secrets_stack
          - google_docs_stack
    name: stack (${{ matrix.tests }})
    steps:
      - uses: actions/checkout@v4
      # The stack's images and the debug build need roughly 30 GB. Hosted
      # runners now have far more free, so clean up only when they don't:
      # the cleanup used to take 2-5 minutes per job for under 1 GB.
      - name: Free disk space (only if short)
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "free: ${avail} GB"
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
            docker image prune -af
            df -h /
          fi
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: sesh-images
          path: /tmp/images
      - name: Load the dev images
        run: |
          for f in /tmp/images/*.tar; do docker load -i "$f"; done
          rm -rf /tmp/images
      # SC-005 (specs/002-gateway-core): containers get no internet while
      # the stack tests run. DOCKER-USER filters only traffic forwarded from
      # containers, so image pulls and cargo (host traffic) still work.
      - name: Block containers' internet access
        run: |
          ext=$(ip -o route show default | awk '{print $5; exit}')
          sudo iptables -I DOCKER-USER -o "$ext" -j DROP
          sudo ip6tables -I DOCKER-USER -o "$ext" -j DROP 2>/dev/null || true
          sudo iptables -S DOCKER-USER
      - name: Stack test
        env:
          SESH_TEST_NO_INTERNET: "1"
        run: make stack-test STACK_TESTS="${{ matrix.tests }}"
      - name: Disk usage
        if: failure()
        run: df -h / && docker system df || true
      - name: Stack logs
        if: failure()
        run: docker compose -p sesh logs --no-color --tail 200 || true
