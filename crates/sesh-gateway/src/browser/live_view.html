<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent's browser</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f8; --fg:#1c1e21; --muted:#5f6670; --edge:#d4d7dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1f22; --fg:#e8eaed; --muted:#9aa0a6; --edge:#3a3d41; } }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:13px system-ui,sans-serif; }
  .box { position:relative; max-width:480px; border:1px solid var(--edge); border-radius:10px; overflow:hidden; cursor:pointer; }
  img { display:block; width:100%; aspect-ratio:16/10; object-fit:contain; background:#000; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#d93025; margin-right:6px; }
  .muted { color:var(--muted); }
  button { font:inherit; padding:4px 10px; border-radius:6px; border:1px solid var(--edge); background:transparent; color:inherit; cursor:pointer; }
</style></head>
<body>
<div class="box" id="box" role="button" tabindex="0" aria-label="Open the agent's browser in a larger window">
  <img id="frame" alt="The agent's browser, live">
  <div class="bar"><span><span class="dot"></span><span id="state">Connecting…</span></span><button id="open">Open</button></div>
</div>
<script>
(() => {
  const secret = location.hash.slice(1);
  const img = document.getElementById('frame'), state = document.getElementById('state');
  const labels = { agent: 'Live: the agent is browsing', person: 'Someone has taken over', you: 'You have taken over', closed: 'The browser is closed' };
  function height() { parent.postMessage({ type: 'iframe:height', height: document.body.scrollHeight }, '*'); }
  function open() {
    const u = location.pathname.replace(/\/$/, '') + '/control#' + secret;
    window.open(u, 'sesh-live-' + location.pathname.split('/')[2], 'popup,width=1320,height=900');
  }
  document.getElementById('box').addEventListener('click', open);
  if (!secret) { state.textContent = 'This live view has expired'; height(); return; }
  const ws = new WebSocket(location.href.replace(/^http/, 'ws').replace(/#.*$/, '').replace(/\/?$/, '/ws'));
  ws.binaryType = 'blob';
  let last = null;
  ws.onopen = () => ws.send(JSON.stringify({ secret }));
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'status') state.textContent = labels[m.state] || m.state;
      if (m.type === 'error') state.textContent = m.error;
      return;
    }
    const u = URL.createObjectURL(e.data);
    img.onload = () => { if (last) URL.revokeObjectURL(last); last = u; height(); };
    img.src = u;
  };
  ws.onclose = () => { state.textContent = 'Live view ended'; height(); };
  height();
})();
</script>
</body></html>
