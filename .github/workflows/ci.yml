name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: make check
        run: make check

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The stack's images (Open WebUI, LiteLLM, the three built here) and
      # the debug build of the workspace don't fit in the runner's free
      # disk; drop preinstalled toolchains the stack never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af
          df -h /
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the stub model server image
        run: docker build -f deploy/stub.Dockerfile -t sesh-stub-llm:dev .
      - name: Build the gateway image
        run: docker build -f deploy/gateway.Dockerfile -t sesh-gateway:dev .
      - name: Build the executor image
        run: docker build -f deploy/executor.Dockerfile -t sesh-executor:dev .
      - name: Drop the image build cache
        run: |
          docker builder prune -af
          df -h /
      - name: Stack tests
        run: make stack-test
      - name: Disk usage
        if: failure()
        run: df -h / && docker system df || true
      - name: Stack logs
        if: failure()
        run: docker compose -p sesh logs --no-color --tail 200 || true
